
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <!-- sidebar -->
    <div class="sidebar">
        <h2>MediCare</h2>
        <p class="subtitle">Your Health Assistant</p>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <h4>Previous Chats</h4>
        <div id="chatList"></div>
    </div>

    <!-- chatbot -->
    <div class="main">

        <div class="header">
            <h2>Medical Assistant</h2>
            <p>Ask your health-related questions</p>
        </div>

        <div class="chatbox" id="chatbox">
            <div class="welcome-message">
                <h2>Welcome to MediCare</h2>
                <p>
                    Have a question about your health?
                    Start a conversation with our medical assistant.
                </p>
            </div>
        </div>

        <form class="input-area" id="chatForm">
            <input
                type="text"
                id="message"
                placeholder="Ask your health question..."
                required
            >
            <button type="submit" id="sendBtn">Send</button>
        </form>

        <p class="note">
            For general medical information only.
            Consult a doctor for diagnosis or treatment.
        </p>

    </div>
</div>

<script>
    let currentChatId = null;
    let isSending = false;

    const chatbox = document.getElementById("chatbox");
    const chatList = document.getElementById("chatList");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const form = document.getElementById("chatForm");

    // display message in chat
    function addMessage(text, role) {
        const div = document.createElement("div");

        div.className = role === "user"
            ? "user-message"
            : "bot-message";

        div.textContent = text;

        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;

        return div;
    }

    // get all previous chats
    async function loadChats() {
        try {
            const response = await fetch("/chats");

            if (!response.ok) {
                throw new Error("Unable to load chats");
            }

            const chats = await response.json();
            chatList.innerHTML = "";

            chats.forEach(chat => {
                const div = document.createElement("div");
                div.className = "chat-item";

                if (chat.id === currentChatId) {
                    div.classList.add("active");
                }

                const title = document.createElement("span");
                title.className = "chat-title";
                title.textContent = chat.title;
                title.title = chat.title;

                title.onclick = () => openChat(chat.id);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "×";
                deleteBtn.title = "Delete chat";
                deleteBtn.setAttribute("aria-label", "Delete " + chat.title);

                deleteBtn.onclick = () => deleteChat(chat.id);

                div.appendChild(title);
                div.appendChild(deleteBtn);

                chatList.appendChild(div);
            });

        } catch (error) {
            console.error(error);
        }
    }

    // create new chat
    async function newChat() {
        if (isSending) return;

        try {
            const response = await fetch("/new_chat", {
                method: "POST"
            });

            if (!response.ok) {
                throw new Error("Unable to create chat");
            }

            const data = await response.json();

            currentChatId = data.chat_id;

            chatbox.innerHTML = `
                <div class="welcome-message">
                    <h2>New Conversation</h2>
                    <p>What would you like to know about your health?</p>
                </div>
            `;

            await loadChats();
            input.focus();

        } catch (error) {
            alert("Unable to create a new chat.");
        }
    }

    // open previous chat
    async function openChat(chatId) {
        if (isSending) return;

        try {
            const response = await fetch(`/chat/${chatId}`);

            if (!response.ok) {
                throw new Error("Unable to open chat");
            }

            const messages = await response.json();

            currentChatId = chatId;
            chatbox.innerHTML = "";

            if (messages.length === 0) {
                addMessage("How can I help you today?", "assistant");
            }

            messages.forEach(msg => {
                addMessage(msg.content, msg.role);
            });

            await loadChats();

        } catch (error) {
            alert("Unable to load this conversation.");
        }
    }

    // delete selected chat
    async function deleteChat(chatId) {
        if (isSending) return;

        const confirmDelete = confirm(
            "Are you sure you want to delete this chat?"
        );

        if (!confirmDelete) return;

        try {
            const response = await fetch(`/chat/${chatId}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Unable to delete chat");
            }

            // clear chatbox if deleted chat is currently open
            if (currentChatId === chatId) {
                currentChatId = null;

                chatbox.innerHTML = `
                    <div class="welcome-message">
                        <h2>Welcome to MediCare</h2>
                        <p>Start a new conversation.</p>
                    </div>
                `;
            }

            // refresh previous chats
            await loadChats();

        } catch (error) {
            alert("Unable to delete chat.");
            console.error(error);
        }
    }

    // send message to flask
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = input.value.trim();

        if (!message || isSending) return;

        isSending = true;
        sendBtn.disabled = true;

        try {
            // create chat if no chat selected
            if (currentChatId === null) {
                const newResponse = await fetch("/new_chat", {
                    method: "POST"
                });

                if (!newResponse.ok) {
                    throw new Error("Unable to create chat");
                }

                const newData = await newResponse.json();
                currentChatId = newData.chat_id;
            }

            const welcome = chatbox.querySelector(".welcome-message");
            if (welcome) welcome.remove();

            addMessage(message, "user");
            input.value = "";

            const loading = addMessage("Thinking...", "assistant");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        chat_id: currentChatId
                    })
                });

                const data = await response.json();
                loading.remove();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong");
                }

                addMessage(data.reply, "assistant");

            } catch (error) {
                loading.remove();
                addMessage(
                    "Sorry, unable to respond right now.",
                    "assistant"
                );
                console.error(error);
            }

            await loadChats();

        } catch (error) {
            alert(error.message);

        } finally {
            isSending = false;
            sendBtn.disabled = false;
            input.focus();
        }
    });

    // load previous chats when page opens
    loadChats();
</script>

</body>
</html>
