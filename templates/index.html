
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>MediCare</h2>
        <p class="subtitle">Your Health Assistant</p>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <h4>Previous Chats</h4>
        <div id="chatList"></div>
    </div>

    <!-- MAIN CHAT SECTION -->
    <div class="main">

        <div class="header">
            <h2>Medical Assistant</h2>
            <p>Ask your health-related questions</p>
        </div>

        <!-- CHAT MESSAGES -->
        <div class="chatbox" id="chatbox"></div>

        <!-- USER INPUT -->
        <form class="input-area" id="chatForm">

            <input
                type="text"
                id="message"
                placeholder="Ask your health question..."
                maxlength="2000"
                autocomplete="off"
                required
            >

            <button type="submit" id="sendBtn">
                Send
            </button>

        </form>

        <p class="note">
            For general medical information only.
            Consult a doctor for diagnosis or treatment.
        </p>

    </div>
</div>

<script>

    // GLOBAL VARIABLES

    let currentChatId = null;
    let isSending = false;

    const chatbox = document.getElementById("chatbox");
    const chatList = document.getElementById("chatList");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const form = document.getElementById("chatForm");


    // WELCOME MESSAGE

    const welcomeText =
        "Hello! I'm MediCare, your AI health assistant. " +
        "I can help you understand symptoms, medical conditions, " +
        "and general health information. " +
        "How can I help you today?";


    function showWelcomeMessage() {
        chatbox.innerHTML = "";
        addMessage(welcomeText, "assistant");
    }


    // DISPLAY MESSAGES

    function addMessage(text, role) {

        const div = document.createElement("div");

        div.className = role === "user"
            ? "user-message"
            : "bot-message";

        div.textContent = text;

        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;

        return div;
    }


    // LOAD PREVIOUS CHATS

    async function loadChats() {

        try {

            // Correct endpoint for chat list
            const response = await fetch("/chats");

            if (!response.ok) {
                throw new Error("Unable to load chats");
            }

            const chats = await response.json();

            chatList.innerHTML = "";

            chats.forEach(chat => {

                const div = document.createElement("div");
                div.className = "chat-item";

                if (chat.id === currentChatId) {
                    div.classList.add("active");
                }

                const title = document.createElement("span");
                title.className = "chat-title";
                title.textContent = chat.title;
                title.title = chat.title;

                title.onclick = () => openChat(chat.id);

                // DELETE BUTTON
                const deleteBtn = document.createElement("button");

                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "×";
                deleteBtn.title = "Delete chat";

                deleteBtn.setAttribute(
                    "aria-label",
                    "Delete " + chat.title
                );

                deleteBtn.onclick = () => deleteChat(chat.id);

                div.appendChild(title);
                div.appendChild(deleteBtn);

                chatList.appendChild(div);

            });

        } catch (error) {
            console.error("Error loading chats:", error);
        }
    }


    // CREATE NEW CHAT

    async function newChat() {

        if (isSending) return;

        try {

            const response = await fetch("/new_chat", {
                method: "POST"
            });

            if (!response.ok) {
                throw new Error("Unable to create chat");
            }

            const data = await response.json();

            currentChatId = data.chat_id;

            showWelcomeMessage();

            await loadChats();
            input.focus();

        } catch (error) {
            console.error(error);
            alert("Unable to create a new chat.");
        }
    }


    // OPEN PREVIOUS CHAT

    async function openChat(chatId) {

        if (isSending) return;

        try {

            const response = await fetch(`/chat/${chatId}`);

            if (!response.ok) {
                throw new Error("Unable to open chat");
            }

            const messages = await response.json();

            currentChatId = chatId;
            chatbox.innerHTML = "";

            if (messages.length === 0) {

                showWelcomeMessage();

            } else {

                messages.forEach(msg => {
                    addMessage(msg.content, msg.role);
                });

            }

            await loadChats();

        } catch (error) {
            console.error(error);
            alert("Unable to load this conversation.");
        }
    }


    // DELETE SELECTED CHAT

    async function deleteChat(chatId) {

        if (isSending) return;

        const confirmDelete = confirm(
            "Are you sure you want to delete this chat?"
        );

        if (!confirmDelete) return;

        try {

            const response = await fetch(`/chat/${chatId}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Unable to delete chat");
            }

            if (currentChatId === chatId) {
                currentChatId = null;
                showWelcomeMessage();
            }

            await loadChats();

        } catch (error) {
            console.error(error);
            alert("Unable to delete chat.");
        }
    }


    // PROCESS STREAMING SSE EVENT

    function processStreamEvent(eventText, botBubble, state) {

        const lines = eventText.split("\n");

        const eventLine = lines.find(
            line => line.startsWith("event:")
        );

        const dataLines = lines
            .filter(line => line.startsWith("data:"))
            .map(line => line.slice(5).trimStart());

        if (dataLines.length === 0) return;

        const eventType = eventLine
            ? eventLine.slice(6).trim()
            : "message";

        const data = JSON.parse(dataLines.join("\n"));

        // AI sends new text
        if (eventType === "chunk") {

            botBubble.textContent += data.content;

            chatbox.scrollTop = chatbox.scrollHeight;

        }

        // AI completed its response
        else if (eventType === "done") {
            state.completed = true;
        }

        // An error occurred during streaming
        else if (eventType === "error") {
            state.error = data.content || "Streaming failed";
        }
    }


    // SEND MESSAGE TO FLASK WITH STREAMING

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const message = input.value.trim();

        if (!message || isSending) return;

        isSending = true;
        sendBtn.disabled = true;

        let userBubble = null;
        let botBubble = null;

        try {

            // Create chat automatically if needed
            if (currentChatId === null) {

                const newResponse = await fetch("/new_chat", {
                    method: "POST"
                });

                if (!newResponse.ok) {
                    throw new Error("Unable to create chat");
                }

                const newData = await newResponse.json();
                currentChatId = newData.chat_id;
            }

            // Show user's message
            userBubble = addMessage(message, "user");
            input.value = "";

            // Temporary loading message
            botBubble = addMessage("Thinking...", "assistant");

            // STREAMING REQUEST
            const response = await fetch("/chat-stream", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message,
                    chat_id: currentChatId
                })

            });

            // Handle HTTP errors before reading the stream
            if (!response.ok) {

                const errorData = await response.json();

                throw new Error(
                    errorData.error || "Request failed"
                );
            }

            if (!response.body) {
                throw new Error("Streaming is not supported");
            }

            // Read the streaming response
            const reader = response.body.getReader();

            const decoder = new TextDecoder();

            let buffer = "";

            const state = {
                completed: false,
                error: null
            };

            // Clear Thinking... before displaying tokens
            botBubble.textContent = "";

            while (true) {

                const { value, done } = await reader.read();

                if (done) break;

                // Convert bytes to text
                buffer += decoder.decode(value, {
                    stream: true
                });

                // Normalize line endings
                buffer = buffer.replace(/\r\n/g, "\n");

                // Split complete SSE events
                const events = buffer.split("\n\n");

                // Keep unfinished event for next read
                buffer = events.pop();

                for (const eventText of events) {

                    if (eventText.trim()) {

                        processStreamEvent(
                            eventText,
                            botBubble,
                            state
                        );

                    }

                }

                if (state.error || state.completed) {
                    break;
                }
            }

            // Check if streaming failed
            if (state.error) {
                throw new Error(state.error);
            }

            // Ensure server confirmed completion
            if (!state.completed) {
                throw new Error(
                    "Stream ended before completion"
                );
            }

            console.log("Streaming completed successfully");


        } catch (error) {

            console.error("Chat streaming error:", error);

            if (botBubble) {

                botBubble.textContent =
                    "Sorry, I couldn't complete the response. " +
                    "Please try again.";

            } else {

                addMessage(
                    "Sorry, I couldn't send your message. Please try again.",
                    "assistant"
                );

            }

        } finally {

            // Refresh sidebar after response
            await loadChats();

            isSending = false;
            sendBtn.disabled = false;

            input.focus();

        }

    });


    // INITIALIZE CHATBOT

    showWelcomeMessage();
    loadChats();

</script>

</body>
</html>
